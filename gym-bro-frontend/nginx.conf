server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container liveness — answered by nginx itself, never proxied.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API proxy — keeps the browser same-origin, so no CORS and no API hostname
    # baked into the bundle. __BACKEND_URL__ is substituted by docker-entrypoint.sh.
    location /api/ {
        # Resolve the backend through Docker's embedded DNS at request time rather
        # than at startup, so nginx boots even if the backend is not up yet.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $gym_bro_backend "__BACKEND_URL__";
        proxy_pass $gym_bro_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve the runtime config (generated by entrypoint)
    location /assets/runtime-config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Static assets with long-term caching
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker — must not be cached
    location = /ngsw.json {
        add_header Cache-Control "no-store";
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-store";
    }

    # Angular app — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
}
