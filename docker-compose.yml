# Local development stack. Self-contained: its own Postgres and its own Keycloak with a
# throwaway realm and dev user. The homelab deployment uses neither — it runs the images
# from Harbor against the shared Keycloak. See ansible/roles/gym-bro in the homelab repo.
services:
  # ── App Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gym-bro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymbro
      POSTGRES_PASSWORD: gymbro_secret
      POSTGRES_DB: gymbro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published so the test suite (and psql) can reach it from the host.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-bro-net

  # ── Keycloak Database ─────────────────────────────────────────────────────────
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: gym-bro-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-bro-net

  # ── Keycloak ──────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: gym-bro-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 5 cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - gym-bro-net

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./gym-bro-backend
      dockerfile: Dockerfile
    container_name: gym-bro-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://gymbro:gymbro_secret@postgres:5432/gymbro
      # JWKS is fetched over the internal network…
      KEYCLOAK_URL: http://keycloak:8080
      # …but tokens are issued to the browser, so the issuer carries the public URL.
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: gym-bro
      KEYCLOAK_CLIENT_ID: gym-bro-app
      CORS_ORIGINS: '["http://localhost", "http://localhost:4200"]'
      RUN_SEED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gym-bro-net

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./gym-bro-frontend
      dockerfile: Dockerfile
    container_name: gym-bro-frontend
    restart: unless-stopped
    environment:
      # Same-origin API: nginx proxies /api/ to the backend, so the browser never
      # makes a cross-origin request.
      API_URL: /api/v1
      BACKEND_URL: http://backend:8000
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: gym-bro
      KEYCLOAK_CLIENT_ID: gym-bro-app
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gym-bro-net

volumes:
  postgres_data:
  keycloak_postgres_data:

networks:
  gym-bro-net:
    driver: bridge
